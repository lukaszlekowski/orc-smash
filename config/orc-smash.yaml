schemaVersion: 1
roles:
  auditor: roles/auditor.md
  planner: roles/planner.md
  reviewer: roles/reviewer.md
  implementer: roles/implementer.md
  committer: roles/committer.md

skills:
  plan-audit:
    file: skills/21-simple-plans-audit/SKILL.md
    role: auditor
    runnerProfile: audit
  plan-follow-up:
    file: skills/22-simple-plans-follow-up/SKILL.md
    role: planner
    runnerProfile: follow-up
  review:
    file: skills/40-simple-review/SKILL.md
    role: reviewer
    runnerProfile: audit
  review-follow-up:
    file: skills/42-simple-review-follow-up/SKILL.md
    role: implementer
    runnerProfile: follow-up
  30-simple-implement:
    file: skills/30-simple-implement/SKILL.md
    role: implementer
    runnerProfile: implement
  50-simple-commit:
    file: skills/50-simple-commit/SKILL.md
    role: committer
    runnerProfile: implement
  research-audit:
    file: skills/10-simple-research-audit/SKILL.md
    role: auditor
    runnerProfile: audit
  research-follow-up:
    file: skills/11-simple-research-follow-up/SKILL.md
    role: planner
    runnerProfile: follow-up
  23-simple-create-plan:
    file: skills/23-simple-create-plan/SKILL.md
    role: planner
    runnerProfile: follow-up
  24-simple-create-spec:
    file: skills/24-simple-create-spec/SKILL.md
    role: planner
    runnerProfile: follow-up

loops:
  research:
    type: approval-loop
    target: { path: docs/dev/research.md, kind: file }
    inputs:
      - { source: target }
      - { source: version }
      - { source: priorArtifact }
      - { source: outputPath }
    evaluate:
      skill: research-audit
      output:
        pattern: "docs/dev/research-audit-v{version}-{provider}.md"
        contract: decision-artifact
        decision: { heading: Verdict, accepted: APPROVED, retry: REJECTED }
    repair:
      skill: research-follow-up
      output:
        pattern: "docs/dev/research-followup-v{version}-{provider}.md"
        contract: completion-artifact
  plan:
    type: approval-loop
    target: { path: docs/dev/plan.md, kind: file }
    files:
      specPath: docs/dev/spec.md
    inputs:
      - { source: target }
      - { source: specPath, label: Specification document }
      - { source: version }
      - { source: priorArtifact }
      - { source: outputPath }
    evaluate:
      skill: plan-audit
      output:
        pattern: "docs/dev/plan-audit-v{version}-{provider}.md"
        contract: decision-artifact
        decision: { heading: Verdict, accepted: APPROVED, retry: REJECTED }
    repair:
      skill: plan-follow-up
      output:
        pattern: "docs/dev/plan-followup-v{version}-{provider}.md"
        contract: completion-artifact
  review:
    type: approval-loop
    target: { path: ".", kind: worktree }
    files:
      specPath: docs/dev/spec.md
      planPath: docs/dev/plan.md
    inputs:
      - { source: specPath, label: Specification document }
      - { source: planPath, label: Implementation plan document }
      - { source: target }
      - { source: version }
      - { source: priorArtifact }
      - { source: outputPath }
    evaluate:
      skill: review
      output:
        pattern: "docs/dev/review-v{version}-{provider}.md"
        contract: decision-artifact
        decision: { heading: Verdict, accepted: APPROVED, retry: REJECTED }
    repair:
      skill: review-follow-up
      output:
        pattern: "docs/dev/review-followup-v{version}-{provider}.md"
        contract: completion-artifact

tasks:
  create-plan:
    skill: 23-simple-create-plan
    target: { path: ".", kind: worktree }
    files:
      researchPath: docs/dev/research.md
    inputs:
      - { source: researchPath }
      - { source: target }
      - { source: version }
      - { source: priorArtifact }
      - { source: outputPath }
    output:
      pattern: "docs/dev/create-plan-v{version}-{provider}.md"
      contract: completion-artifact
  create-spec:
    skill: 24-simple-create-spec
    target: { path: ".", kind: worktree }
    files:
      planPath: docs/dev/plan.md
    inputs:
      - { source: planPath, label: Implementation plan document }
      - { source: version }
      - { source: outputPath }
    output:
      pattern: "docs/dev/create-spec-v{version}-{provider}.md"
      contract: completion-artifact
  implement:
    skill: 30-simple-implement
    target: { path: ".", kind: worktree }
    files:
      specPath: docs/dev/spec.md
      planPath: docs/dev/plan.md
    inputs:
      - { source: specPath, label: Specification document }
      - { source: planPath, label: Implementation plan document }
      - { source: version }
      - { source: priorArtifact }
      - { source: outputPath }
    output:
      pattern: "docs/dev/impl-v{version}-{provider}.md"
      contract: required-artifact
      validator: implement-ledger
  commit:
    skill: 50-simple-commit
    target: { path: ".", kind: worktree }
    inputs:
      - { source: target }
      - { source: version }
      - { source: outputPath }
    output:
      pattern: "docs/dev/commit-v{version}-{provider}.md"
      contract: completion-artifact

pipelines:
  default:
    stages:
      - { stageId: plan, loop: plan }
      - { stageId: implement, task: implement }
      - { stageId: review, loop: review }
  research-first:
    stages:
      - { stageId: research, loop: research }
      - { stageId: create-plan, task: create-plan }
      - { stageId: plan, loop: plan }
      - { stageId: implement, task: implement }
      - { stageId: review, loop: review }
